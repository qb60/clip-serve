[package]
name = "clipserve"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Serve clipboard images from the Windows notification area"

[dependencies]
httparse = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
polling = "3.11"
rand = { version = "0.10", features = ["unbiased"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
arboard = "3.7"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Security_Authorization",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
strip = true
